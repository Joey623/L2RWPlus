[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l2rwplus"
version = "0.1.0"
description = "Federated visible-infrared person re-identification under uCI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "numpy==2.4.6",
    "Pillow==12.3.0",
    "lmdb==2.3.0",
]

[project.scripts]
l2rwplus-train = "l2rwplus.cli.train:main"
l2rwplus-evaluate = "l2rwplus.cli.evaluate:main"
l2rwplus-prepare = "l2rwplus.cli.prepare:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["l2rwplus*"]
